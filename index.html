    /* Ezt tedd a <style> blokkba */
body {
  -webkit-user-select: none; /* Safari */
  -ms-user-select: none; /* IE 10 and IE 11 */
  user-select: none; /* Standard syntax */
}

  /* Gomb stílusa, ami megnyitja a modalt */
  .readme-trigger-btn {
    background-color: #2563eb;
    color: #ffffff;
    border: none;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .readme-trigger-btn:hover {
    background-color: #1d4ed8;
  }

  .readme-trigger-btn:active {
    transform: scale(0.98);
  }

  /* Modal sötétített háttér (Backdrop) */
  .modal-overlay {
    display: none; /* Alapértelmezetten rejtett */
    position: fixed;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px); /* Finom elmosás a háttérben */
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.2s ease-out;
  }

  /* Modal ablak konténere */
  .modal-card {
    background-color: #ffffff;
    color: #1f2937;
    width: 100%;
    max-width: 760px;
    max-height: 85vh;
    border-radius: 12px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    animation: slideUp 0.25s ease-out;
  }

  /* Fejléc és bezáró gomb */
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid #e5e7eb;
  }

  .modal-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin: 0;
    color: #111827;
  }

  .modal-close-btn {
    background: transparent;
    border: none;
    font-size: 20px;
    color: #6b7280;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    transition: color 0.15s, background-color 0.15s;
  }

  .modal-close-btn:hover {
    color: #111827;
    background-color: #f3f4f6;
  }

  /* README Tartalom terület formázása */
  .modal-body {
    padding: 24px;
    overflow-y: auto;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    font-size: 15px;
  }

  /* Formázások a betöltött Markdown tartalomhoz */
  .modal-body h1, .modal-body h2, .modal-body h3 {
    color: #111827;
    margin-top: 1.5em;
    margin-bottom: 0.5em;
    font-weight: 700;
  }

  .modal-body h1:first-child, .modal-body h2:first-child {
    margin-top: 0;
  }

  .modal-body h2 {
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 0.3em;
  }

  .modal-body hr {
    border: 0;
    height: 1px;
    background: #e5e7eb;
    margin: 24px 0;
  }

  .modal-body code {
    background-color: #f3f4f6;
    color: #d97706;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .modal-body pre code {
    display: block;
    padding: 12px;
    background-color: #1f2937;
    color: #f9fafb;
    overflow-x: auto;
    border-radius: 6px;
  }

  .modal-body a {
    color: #2563eb;
    text-decoration: none;
  }

  .modal-body a:hover {
    text-decoration: underline;
  }

  .modal-body ol, .modal-body ul {
    padding-left: 20px;
    margin-bottom: 1em;
  }

  .modal-body li {
    margin-bottom: 6px;
  }

  /* Animációk */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* Automatikus Sötét Mód támogatás (ha a felhasználó gépe sötét módban van) */
  @media (prefers-color-scheme: dark) {
    .modal-card {
      background-color: #1e293b;
      color: #e2e8f0;
    }
    .modal-header {
      border-bottom-color: #334155;
    }
    .modal-title {
      color: #f8fafc;
    }
    .modal-close-btn {
      color: #94a3b8;
    }
    .modal-close-btn:hover {
      color: #f8fafc;
      background-color: #334155;
    }
    .modal-body h1, .modal-body h2, .modal-body h3 {
      color: #f8fafc;
    }
    .modal-body h2, .modal-body hr {
      border-color: #334155;
      background-color: #334155;
    }
    .modal-body code {
      background-color: #0f172a;
      color: #fbbf24;
    }
    .modal-body a {
      color: #60a5fa;
    }
  }
</style>

  // 2. Billentyűkombinációk tiltása (F12, Ctrl+Shift+I, Ctrl+U, Ctrl+S)
  document.addEventListener('keydown', function(e) {
    // F12 tiltása
    if (e.key === "F12") {
      e.preventDefault();
    }
    // Ctrl+Shift+I (DevTools), Ctrl+Shift+J (Console), Ctrl+Shift+C (Element inspector)
    if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
      e.preventDefault();
    }
    // Ctrl+U (Forráskód megtekintése)
    if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
      e.preventDefault();
    }
    // Ctrl+S (Mentés)
    if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
    }
  });
        
    const modal = document.getElementById('readmeModal');
  const openBtn = document.getElementById('openReadmeBtn');
  const closeBtn = document.getElementById('closeReadmeBtn');
  const contentDiv = document.getElementById('readmeContent');

  openBtn.onclick = function() {
    modal.style.display = "flex"; // flex-et használunk a középre igazításhoz
    
    // 1. Megkeressük az aktuális nyelvet (pl. 'hu', 'en', 'fr')
    // Állítsd be azt a változót, amit az alkalmazásod a nyelv tárolására használ:
    const activeLang = typeof currentLang !== 'undefined' ? currentLang : 'hu';
    
    // 2. Kiválasztjuk a nyelvi beállításokat a translations objektumból
    const langConfig = translations[activeLang] || translations.hu;
    const fileToFetch = langConfig.readmeFile || 'README.md';

    // Betöltés jelzése a felhasználónak
    contentDiv.innerHTML = '<p style="text-align: center; color: #6b7280;">Loading...</p>';
    
    // 3. Betöltjük a dinamikus README fájlt
    fetch(fileToFetch)
      .then(response => {
        if (!response.ok) {
            // Ha az adott nyelvű fájl hiányzik, visszaugrunk a gyökér README.md-re
            return fetch('README.md').then(res => res.text());
        }
        return response.text();
      })
      .then(markdownText => {
        contentDiv.innerHTML = marked.parse(markdownText);
      })
      .catch(error => {
        contentDiv.innerHTML = '<p style="color:#ef4444; text-align:center;">Hiba történt a leírás betöltésekor.</p>';
        console.error(error);
      });
  }

  closeBtn.onclick = function() {
    modal.style.display = "none";
  }

  window.onclick = function(event) {
    if (event.target == modal) {
      modal.style.display = "none";
    }
  }

        let currentLang = localStorage.getItem('preferredLang') || 'hu';

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('preferredLang', lang);
            document.getElementById('langSelect').value = lang;
            document.documentElement.lang = lang;

            const t = translations[lang];

            // Szövegek frissítése
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });

            // Placeholderek frissítése
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const key = el.getAttribute('data-i18n-ph');
        if (t[key]) el.placeholder = t[key];
    });

    if (document.getElementById('docTitle')) {
        document.getElementById('docTitle').innerText = t.docTitle;
    }
    
    // ➕ GARANTÁLT FIX: Közvetlenül frissítjük a Segítség gombot és címeit
    const btn = document.getElementById('openReadmeBtn');
    const title = document.getElementById('readmeModalTitle');
    
    if (btn && t.readmeBtn) btn.innerText = t.readmeBtn;
    if (title && t.readmeTitle) title.innerText = t.readmeTitle;

    updateApiKeyPlaceholder();
        }

        function updateApiKeyPlaceholder() {
            const selectedModel = document.getElementById("modelSelect").value;
            const apiKeyInput = document.getElementById('apiKey');
            if (selectedModel.includes("gemini")) {
                apiKeyInput.placeholder = "GEMINI API KEY...";
            } else {
                apiKeyInput.placeholder = "GROQ API KEY...";
            }
        }

        document.getElementById('langSelect').addEventListener('change', (e) => changeLanguage(e.target.value));
        document.querySelector('#modelSelect').addEventListener('change', updateApiKeyPlaceholder);
        
        // Oldal betöltésekor azonnal alkalmazza a mentett nyelvet
        changeLanguage(currentLang);

        async function analyzePrompt() {
            const t = translations[currentLang];
            const apiKey = document.getElementById('apiKey').value.trim();
            const userPrompt = document.getElementById('userPrompt').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const aiResponseDiv = document.getElementById('aiResponse');

            // Dinamikus nyelvi ellenőrzés alert üzenettel
            if (!apiKey) {
                alert(t.errApiKey);
                return;
            }
            if (!userPrompt) {
                alert(t.errPrompt);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = t.analyzingBtn;
            aiResponseDiv.innerText = t.thinkingMsg;

            try {
                const selectedModel = document.getElementById("modelSelect").value;
                let originalResponseText = "";

                if (selectedModel.includes("gemini")) {
                    const apiVersion = "v1beta"; 
                    const apiUrl = `https://generativelanguage.googleapis.com/${apiVersion}/models/${selectedModel}:generateContent?key=${apiKey}`;

                    const response = await fetch(apiUrl, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userPrompt }] }]
                        })
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(`Gemini API Error (${response.status}): ${errData.error?.message || 'Unknown error.'}`);
                    }

                    const resData = await response.json();
                    originalResponseText = resData.candidates[0].content.parts[0].text;

                } else {
                    const apiUrl = "https://api.groq.com/openai/v1/chat/completions";

                    const response = await fetch(apiUrl, {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${apiKey}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: selectedModel,
                            messages: [{ role: "user", content: userPrompt }]
                        })
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(`API Error (${response.status}): ${errData.error?.message || 'Unknown error.'}`);
                    }

                    const resData = await response.json();
                    originalResponseText = resData.choices[0].message.content;
                }

                aiResponseDiv.innerText = originalResponseText;

                // Szigorúan a választott nyelvre kikötött System Prompt
                const evaluationSystemPrompt = `You are an AI prompt expert. Evaluate the user's prompt based on the following 4 criteria, scoring each from 0 to 100:
1. Role (Did they specify a precise role for the AI?)
2. Context (Did they explain the background/context?)
3. Task (Is the goal/task clear?)
4. Constraints (Are there limitations like length, tone, structure?)

Return ONLY a valid JSON object without markdown formatting. Write the "feedback" string STRICTLY in ${t.langName} language!
JSON structure:
{
    "role_score": 80,
    "context_score": 50,
    "task_score": 90,
    "constraints_score": 30,
    "feedback": "Detailed constructive advice in ${t.langName} on how to improve the prompt."
}`;

                let evalResponseText = "";

                if (selectedModel.includes("gemini")) {
                    const apiVersion = "v1beta"; 
                    const evalUrl = `https://generativelanguage.googleapis.com/${apiVersion}/models/${selectedModel}:generateContent?key=${apiKey}`;
                
                    const evalRes = await fetch(evalUrl, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{
                                role: "user",
                                parts: [{ text: `${evaluationSystemPrompt}\n\nUser Prompt to evaluate: "${userPrompt}"` }]
                            }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    if (!evalRes.ok) {
                        const errData = await evalRes.json().catch(() => ({}));
                        throw new Error(`Gemini Eval Error (${evalRes.status}): ${errData.error?.message || 'Failed evaluation.'}`);
                    }

                    const evalData = await evalRes.json();
                    evalResponseText = evalData.candidates[0].content.parts[0].text;

                } else {
                    const evalRes = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${apiKey}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: "llama-3.3-70b-versatile",
                            response_format: { type: "json_object" },
                            messages: [
                                { role: "system", content: evaluationSystemPrompt },
                                { role: "user", content: `Prompt to evaluate: "${userPrompt}"` }
                            ]
                        })
                    });

                    if (!evalRes.ok) {
                        const errData = await evalRes.json().catch(() => ({}));
                        throw new Error(`Groq Eval Error (${evalRes.status}): ${errData.error?.message || 'Failed evaluation.'}`);
                    }

                    const evalData = await evalRes.json();
                    evalResponseText = evalData.choices[0].message.content;
                }

                const result = JSON.parse(evalResponseText);
                updateUI(result);

            } catch (error) {
                console.error(error);
                aiResponseDiv.innerText = `Error:\n${error.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = t.submitBtn;
            }
        }

        function updateUI(data) {
            const t = translations[currentLang];

            document.getElementById('p-role').innerText = data.role_score + '%';
            document.getElementById('b-role').style.width = data.role_score + '%';

            document.getElementById('p-context').innerText = data.context_score + '%';
            document.getElementById('b-context').style.width = data.context_score + '%';

            document.getElementById('p-task').innerText = data.task_score + '%';
            document.getElementById('b-task').style.width = data.task_score + '%';

            document.getElementById('p-constraints').innerText = data.constraints_score + '%';
            document.getElementById('b-constraints').style.width = data.constraints_score + '%';

            const totalAverage = Math.round((data.role_score + data.context_score + data.task_score + data.constraints_score) / 4);
            document.getElementById('scoreText').innerText = totalAverage + '%';

            const circle = document.getElementById('scoreCircle');
            if (totalAverage >= 80) {
                circle.className = "relative w-24 h-24 flex items-center justify-center bg-gray-700 rounded-full border-4 border-emerald-500";
                document.getElementById('ratingLabel').innerText = t.ratingGreat;
                document.getElementById('ratingDesc').innerText = t.descGreat;
            } else if (totalAverage >= 50) {
                circle.className = "relative w-24 h-24 flex items-center justify-center bg-gray-700 rounded-full border-4 border-yellow-500";
                document.getElementById('ratingLabel').innerText = t.ratingMedium;
                document.getElementById('ratingDesc').innerText = t.descMedium;
            } else {
                circle.className = "relative w-24 h-24 flex items-center justify-center bg-gray-700 rounded-full border-4 border-red-500";
                document.getElementById('ratingLabel').innerText = t.ratingPoor;
                document.getElementById('ratingDesc').innerText = t.descPoor;
            }

            document.getElementById('feedbackText').innerText = data.feedback;
        }
    </script>
